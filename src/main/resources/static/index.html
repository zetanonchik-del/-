<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Образовательная платформа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="lib/mammoth.browser.min.js"></script>
  <link rel="stylesheet" href="style.css?v=20260918_v8">
  <style>
    /* Critical layout to prevent overlays from ever leaking into normal document flow */
    .player-section { width: 100%; background: #000; position: relative; user-select: none; }
    .video-container { width: 100%; background: #000; position: relative; overflow: hidden; user-select: none; }
    .video-container video { width: 100%; display: block; background: #000; user-select: none; }
    .video-gesture-layer {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 54px !important;
      z-index: 15 !important;
      background: transparent !important;
      cursor: pointer !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    .video-seek-overlay {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      width: 42% !important;
      display: none !important;
      align-items: center !important;
      justify-content: center !important;
      pointer-events: none !important;
      z-index: 30 !important;
      opacity: 0 !important;
      overflow: hidden !important;
      user-select: none !important;
    }
    .video-seek-overlay.active {
      display: flex !important;
      opacity: 1 !important;
    }
    .video-seek-overlay.seek-left { left: 0 !important; border-radius: 0 100% 100% 0 !important; }
    .video-seek-overlay.seek-right { right: 0 !important; border-radius: 100% 0 0 100% !important; }
    .video-tap-feedback.feedback-center {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scale(0.7) !important;
      display: none !important;
      pointer-events: none !important;
      z-index: 35 !important;
    }
    .video-tap-feedback.feedback-center.show {
      display: flex !important;
      opacity: 1 !important;
    }

    /* Elegant translated tooltip for rotate video button */
    .video-rotate-btn::before {
      content: "";
      position: absolute;
      right: calc(100% + 2px);
      top: 50%;
      transform: translateY(-50%) scale(0.85);
      border: 5px solid transparent;
      border-left-color: rgba(18, 20, 26, 0.95);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
      z-index: 2147483648;
    }
    .video-rotate-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      right: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%) scale(0.92);
      background: rgba(18, 20, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, transform 0.18s ease;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      z-index: 2147483648;
    }
    .video-rotate-btn:hover::before,
    .video-rotate-btn:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%) scale(1);
    }
  </style>
</head>
<body>
  <!-- Access Denied Screen: Big bold X in black & white, beautiful dark ambient background, zero words -->
  <div id="accessDeniedScreen" class="access-denied-screen">
    <div class="access-denied-backdrop"></div>
    <div class="access-denied-glow"></div>
    <div class="access-denied-card">
      <svg class="access-denied-x" viewBox="0 0 100 100">
        <line x1="26" y1="26" x2="74" y2="74" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
        <line x1="74" y1="26" x2="26" y2="74" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
      </svg>
    </div>
  </div>

  <div class="app-container">
    <!-- Селекторы модуля и урока -->
    <header class="controls-header">
      <div class="selector-row">
        <div class="dropdown-wrapper month-box" id="monthDropdownWrapper">
          <label>Модуль:</label>
          <div class="dropdown-btn" id="monthDropdownBtn">
            <span id="selectedMonthText">Модуль 1</span>
            <span class="arrow">▼</span>
          </div>
          <div class="dropdown-menu" id="monthDropdownMenu"></div>
        </div>

        <div class="dropdown-wrapper lesson-box" id="lessonDropdownWrapper">
          <label>Урок:</label>
          <div class="dropdown-btn" id="lessonDropdownBtn">
            <span id="selectedLessonText">Выберите урок...</span>
            <span class="arrow">▼</span>
          </div>
          <div class="dropdown-menu" id="lessonDropdownMenu"></div>
        </div>
      </div>

      <!-- Живой поиск -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="liveSearchInput" placeholder="Поиск урока по теме или слову..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn" style="display:none;">✕</button>
      </div>
      <div id="searchResults" class="search-dropdown" style="display: none;"></div>
    </header>

    <!-- Плеер видео -->
    <section class="player-section">
      <div class="video-container" id="videoContainer">
        <video id="videoPlayer" controls playsinline controlsList="nodownload" preload="metadata"></video>
        <!-- Прозрачный слой для перехвата кликов и двойных кликов перемотки (защита от нативного fullscreen на ПК) -->
        <div class="video-gesture-layer" id="videoGestureLayer"></div>
        <!-- Быстрая перемотка YouTube: +5, +10, +15... -->
        <div class="video-seek-overlay seek-left" id="seekOverlayLeft" style="display:none;">
          <div class="seek-ripple"></div>
          <div class="seek-badge">
            <span class="seek-chevron">‹</span>
            <span class="seek-seconds" id="seekSecondsLeft">5</span>
          </div>
        </div>

        <div class="video-tap-feedback feedback-center" id="tapFeedbackCenter" style="display:none;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <polyline points="21 3 21 8 16 8"></polyline>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <polyline points="3 21 3 16 8 16"></polyline>
          </svg>
        </div>

        <div class="video-seek-overlay seek-right" id="seekOverlayRight" style="display:none;">
          <div class="seek-ripple"></div>
          <div class="seek-badge">
            <span class="seek-seconds" id="seekSecondsRight">+5</span>
            <span class="seek-chevron">›</span>
          </div>
        </div>

        <!-- Кнопка поворота экрана: чистый стильный векторный SVG вместо эмодзи -->
        <button id="rotateVideoBtn" class="video-rotate-btn" title="Повернуть видео" aria-label="Повернуть видео" data-tooltip="Повернуть видео">
          <svg class="rotate-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <polyline points="21 3 21 8 16 8"></polyline>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <polyline points="3 21 3 16 8 16"></polyline>
          </svg>
        </button>
        <button id="exitLandscapeBtn" class="exit-landscape-btn" style="display:none;">✕</button>
      </div>
      <div class="media-parts-bar" id="videoBar">
        <button id="prevVideoBtn" class="pill-btn">◀</button>
        <span id="videoPartTitle" class="badge">Видео: 1/1</span>
        <button id="nextVideoBtn" class="pill-btn">▶</button>
      </div>
    </section>

    <!-- Заголовок урока -->
    <div class="lesson-meta">
      <div id="lessonBadge" class="lesson-badge">Модуль 1 • Урок 1</div>
      <h1 id="lessonHeading">Загрузка...</h1>
    </div>

    <!-- Вкладки материалов -->
    <nav class="tabs-nav">
      <button class="tab-item active" data-tab="hw">📝 Домашка</button>
      <button class="tab-item" data-tab="pdf">📄 Конспекты PDF</button>
      <button class="tab-item" data-tab="zip">📦 Исходный код</button>
    </nav>

    <!-- Контент активной вкладки -->
    <main class="tab-content-area">
      <!-- Блок перелистывания файлов текущей вкладки (1/N) -->
      <div class="sub-parts-bar" id="subPartsBar" style="display: none;">
        <button id="prevSubPartBtn" class="pill-btn">◀</button>
        <span id="subPartTitle" class="badge">Файл 1/1</span>
        <button id="nextSubPartBtn" class="pill-btn">▶</button>
      </div>

      <div id="fileTitleHeader" class="file-name-label"></div>
      <div id="mainContentBox" class="content-box">Выберите урок для просмотра</div>

      <div class="action-buttons-row">
        <button id="openDirectBtn" class="action-btn btn-secondary">👁 Открыть файл</button>
        <button id="sendActionBtn" class="action-btn btn-primary">💬 Отправить в чат</button>
      </div>
    </main>
  </div>

  <!-- Модалка универсального просмотра файлов (PDF, Word DOCX, Картинки, Код) -->
  <div id="fileViewerModal" class="file-viewer-modal" style="display:none;">
    <div class="file-viewer-header">
      <span id="fileViewerTitle" class="file-viewer-title"></span>
      <div class="viewer-actions">
        <div id="pdfControls" class="pdf-controls" style="display:none;">
          <button id="pdfZoomOut" class="viewer-icon-btn" title="Уменьшить">−</button>
          <span id="pdfPageInfo" class="pdf-page-info">1 / 1</span>
          <button id="pdfZoomIn" class="viewer-icon-btn" title="Увеличить">+</button>
          <button id="pdfFitWidth" class="viewer-icon-btn" title="По ширине">↔</button>
        </div>
        <div id="pptxControls" class="pptx-controls" style="display:none;">
          <button id="pptxPrevSlide" class="viewer-icon-btn" title="Предыдущий слайд">◀</button>
          <span id="pptxSlideInfo" class="pptx-slide-info">1 / 1</span>
          <button id="pptxNextSlide" class="viewer-icon-btn" title="Следующий слайд">▶</button>
          <button id="pptxToggleMode" class="viewer-icon-btn" title="Режим просмотра">📜</button>
        </div>
        <button id="codeCopyBtn" class="viewer-icon-btn copy-code-btn" style="display:none;" title="Скопировать код">📋</button>
        <button id="fileViewerCloseBtn" class="file-viewer-close">✕</button>
      </div>
    </div>
    <div class="file-viewer-body" id="fileViewerBody">
      <div id="viewerLoading" class="viewer-loading" style="display:none;">
        <div class="spinner"></div>
        <span id="viewerLoadingText">Загрузка документа...</span>
      </div>
      <!-- PPTX presentation container -->
      <div id="pptxViewerContainer" class="pptx-viewer-container" style="display:none;"></div>
      <!-- PDF.js container -->
      <div id="pdfViewerContainer" class="pdf-viewer-container" style="display:none;"></div>
      <!-- Word DOCX (mammoth.js) container -->
      <div id="docViewerContainer" class="doc-viewer-container" style="display:none;"></div>
      <!-- Spreadsheet (XLSX / CSV) container -->
      <div id="sheetViewerContainer" class="sheet-viewer-container" style="display:none;"></div>
      <!-- Audio container -->
      <div id="audioViewerContainer" class="audio-viewer-container" style="display:none;">
        <div class="audio-player-card">
          <div class="audio-icon-wrap">🎵</div>
          <div id="audioTrackTitle" class="audio-title">Track</div>
          <audio id="viewerAudio" controls class="viewer-audio-element"></audio>
        </div>
      </div>
      <!-- Image container -->
      <div id="imageViewerContainer" class="image-viewer-container" style="display:none;">
        <img id="viewerImage" class="viewer-img" alt="Preview">
      </div>
      <!-- Code / text container -->
      <div id="codeViewerContainer" class="code-viewer-container" style="display:none;">
        <pre><code id="viewerCode"></code></pre>
      </div>
      <!-- Universal interactive card container (for PPT, archives, unsupported formats) -->
      <div id="cardViewerContainer" class="card-viewer-container" style="display:none;">
        <div class="file-card-box">
          <div id="fileCardIcon" class="file-card-icon">📊</div>
          <h3 id="fileCardName" class="file-card-name"></h3>
          <p id="fileCardNotice" class="file-card-notice"></p>
          <div class="file-card-actions">
            <button id="cardSendChatBtn" class="action-btn btn-primary">💬 Отправить в чат</button>
            <button id="cardDownloadBtn" class="action-btn btn-secondary">📥 Скачать файл</button>
          </div>
        </div>
      </div>
      <!-- Fallback iframe -->
      <iframe id="fileViewerFrame" class="file-viewer-frame" style="display:none;"></iframe>
    </div>
  </div>

  <script src="app.js?v=20260918_v8"></script>
</body>
</html>
